<!DOCTYPE html>
<html lang="en">
<head>
  <title>Te iubesc extrem de mult <3</title>
  <style>
    body {
      background-image: url('poza.jpeg');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
      color: #990000;
      font-family: 'Brush Script MT', cursive, sans-serif;
      height: 100vh;
      margin: 0;
      position: relative;
    }

    .love-note {
      background-color: rgba(255, 255, 255, 0.8);
      padding: 40px;
      border: 3px solid #ff4d4d;
      border-radius: 25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 300px;
      font-size: 1.5em;
      position: absolute;
      top: 30px;
      right: 30px;
      z-index: 2;
    }

    .hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: 1; /* Behind the love-note */
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      color: #ff4d4d;
      animation: floatUp 5s linear infinite;
      font-size: 24px;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="love-note">
    <3 Voiam sa iti readuc aminte ca te iubesc foarte mult, iubitule,<br>
    si ca imi este tare dor de tine! <3
  </div>

  <div class="hearts-container" id="hearts-container"></div>

  <script>
    const container = document.getElementById("hearts-container");

    const createHeart = () => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "<3";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
      container.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    };

    setInterval(createHeart, 300);
  </script>
</body>
</html>
